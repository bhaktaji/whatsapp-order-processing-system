name: OrderBridge CI

on:
  push:
    branches: ["release/**", "main"]
  pull_request:
    branches: ["main", "release/**"]

jobs:
  backend-and-frontend-ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: orderbridge
          POSTGRES_PASSWORD: ci_postgres_password_2026
          POSTGRES_DB: orderbridge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orderbridge -d orderbridge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://orderbridge:ci_postgres_password_2026@localhost:5432/orderbridge_test
      JWT_SECRET: ci_test_jwt_signing_secret_32_chars_min
      META_VERIFY_TOKEN: ci_test_meta_verify_token_2026
      META_APP_SECRET: ci_test_meta_app_hmac_secret_2026
      PHONE_ENCRYPTION_KEY: ci_test_phone_encryption_key_32b

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff linter & format check
        working-directory: backend
        run: |
          ruff check .
          ruff format --check .

      - name: Run Mypy type checker
        working-directory: backend
        run: mypy app

      - name: Run Alembic migrations on PostgreSQL 16
        working-directory: backend
        run: alembic upgrade head

      - name: Run idempotent demo-tenant seed (twice to verify idempotency)
        working-directory: backend
        run: |
          python -m app.seed
          python -m app.seed

      - name: Run Pytest suite against PostgreSQL 16
        working-directory: backend
        run: pytest -v

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies & verify Vite TypeScript build
        run: |
          npm install --legacy-peer-deps
          npm run lint
          npm run build
