[project]
name = "orderbridge-backend"
version = "2.5.0"
description = "OrderBridge Multi-Tenant WhatsApp Order Capture & ERP Sync Backend"
requires-python = ">=3.10"

[tool.ruff]
line-length = 110
target-version = "py310"
exclude = ["alembic/versions/*", "**/alembic/versions/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
"**/tests/*" = ["S105", "S106"]

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = false
exclude = ["alembic/"]

[tool.pytest.ini_options]
testpaths = ["tests", "backend/tests"]
pythonpath = [".", "backend"]
asyncio_mode = "auto"
