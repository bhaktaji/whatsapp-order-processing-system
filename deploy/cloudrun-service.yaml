apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: orderbridge-api
  labels:
    cloud.googleapis.com/location: asia-south1
    app.kubernetes.io/name: orderbridge
    app.kubernetes.io/part-of: whatsapp-order-processing-system
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/launch-stage: GA
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/startup-cpu-boost: "true"
        run.googleapis.com/cloudsql-instances: "${CLOUDSQL_INSTANCE_CONNECTION_NAME}"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 60
      serviceAccountName: "orderbridge-runtime@${GCP_PROJECT_ID}.iam.gserviceaccount.com"
      containers:
        - name: orderbridge-backend
          image: "asia-south1-docker.pkg.dev/${GCP_PROJECT_ID}/orderbridge/api:${IMAGE_TAG}"
          ports:
            - name: http1
              containerPort: 8000
          env:
            - name: APP_ENV
              value: "production"
            - name: LOG_LEVEL
              value: "INFO"
            - name: ALLOWED_ORIGINS
              value: "${ALLOWED_ORIGINS}"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: orderbridge-database-url
                  key: latest
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: orderbridge-jwt-secret
                  key: latest
            - name: META_VERIFY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: orderbridge-meta-verify-token
                  key: latest
            - name: META_APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: orderbridge-meta-app-secret
                  key: latest
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: orderbridge-gemini-api-key
                  key: latest
          resources:
            limits:
              cpu: "1000m"
              memory: "512Mi"
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            periodSeconds: 10
            failureThreshold: 3
